name: Build and deploy web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Diagnose dependencies
        continue-on-error: true
        run: |
          for c in wasmJsCompileClasspath wasmJsRuntimeClasspath; do
            gradle :shared:dependencyInsight --dependency datetime --configuration $c --no-daemon > deps_$c.log 2>&1 || true
            echo "::error title=diag-$c::$(grep -E 'kotlinx-datetime|-> |^\+--- |^\\--- ' deps_$c.log | head -n 30 | tr '\n' '|')"
          done
          gradle :shared:dependencies --configuration wasmJsRuntimeClasspath --no-daemon > tree.log 2>&1 || true
          echo "::error title=diag-tree::$(grep -E 'datetime' tree.log | head -n 20 | tr '\n' '|')"
          echo "::error title=diag-ver::$(grep -E 'kotlin-stdlib|compose.runtime:runtime|lifecycle-common' tree.log | sort -u | head -n 12 | tr '\n' '|')"

      - name: Build web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: .github/scripts/run-build.sh :shared:wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Prepare site
        run: |
          set -euo pipefail
          DIST=$(find shared/build -type d -path '*dist/wasmJs/productionExecutable' | head -n 1)
          echo "Using $DIST"
          mkdir -p site
          cp -r "$DIST"/. site/
          touch site/.nojekyll
          ls -la site

      - uses: actions/upload-artifact@v4
        with:
          name: wapi-web
          path: site

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
